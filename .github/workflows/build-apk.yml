name: Build Alpha Deck APKs

on:
  push:
    branches: [test/all-combined]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Put the shared debug keystore where Gradle looks for it, so the debug
      # build is signed with the same key as the APKs already on the TV.
      - name: Restore signing key
        run: |
          if [ -z "${{ secrets.SIGNING_KEYSTORE_B64 }}" ]; then echo "Missing SIGNING_KEYSTORE_B64 secret"; exit 1; fi
          if [ -z "${{ secrets.SIGNING_KEYSTORE_PASSWORD }}" ]; then echo "Missing SIGNING_KEYSTORE_PASSWORD secret"; exit 1; fi
          if [ -z "${{ secrets.SIGNING_KEY_ALIAS }}" ]; then echo "Missing SIGNING_KEY_ALIAS secret"; exit 1; fi
          mkdir -p ~/.android
          echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Restore release keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_B64 }}" ]; then echo "Missing RELEASE_KEYSTORE_B64 secret"; exit 1; fi
          if [ -z "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ]; then echo "Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; fi
          if [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]; then echo "Missing RELEASE_KEY_ALIAS secret"; exit 1; fi
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/alphadeck-release.jks"

      - name: Build release and debug
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Sign release, collect APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VC=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          mkdir out
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/al.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/alphadeck-release.jks" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --out "out/alpha-deck-build$VC-release.apk" "$RUNNER_TEMP/al.apk"
          # Gradle may sign debug with the runner's own key, so re-sign it with ours.
          "$BT/apksigner" sign --ks ~/.android/debug.keystore \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --out "out/alpha-deck-build$VC-debug.apk" app/build/outputs/apk/debug/app-debug.apk
          for f in out/*.apk; do echo "$f"; "$BT/apksigner" verify --print-certs "$f" | grep SHA-256; done
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}

      - uses: actions/upload-artifact@v4
        with:
          name: alpha-deck-${{ github.sha }}
          path: out/*.apk
